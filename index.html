<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ELITE FC • Admin</title>

    <link rel="stylesheet" href="admin.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>


    <!-- LOGIN -->

    <div id="login-container">

        <div class="login-box">

            <img
                src="../img/escudo.png"
                alt="ELITE FC">

            <h1>ELITE FC</h1>

            <span>Painel administrativo</span>

            <form id="login-form">

                <input
                    type="email"
                    id="email"
                    placeholder="E-mail"
                    required>

                <input
                    type="password"
                    id="senha"
                    placeholder="Senha"
                    required>

                <button type="submit">

                    Entrar

                    <i class="fa-solid fa-arrow-right"></i>

                </button>

                <p id="login-erro"></p>

            </form>

        </div>

    </div>


    <!-- PAINEL -->

    <div id="painel" class="oculto">

        <header class="admin-header">

            <div class="admin-logo">

                <img
                    src="../img/escudo.png"
                    alt="ELITE FC">

                <div>

                    <strong>ELITE FC</strong>

                    <span>ADMIN</span>

                </div>

            </div>


            <button
                id="logout"
                class="logout">

                <i class="fa-solid fa-right-from-bracket"></i>

                Sair

            </button>

        </header>


        <main class="admin-main">


            <div class="titulo">

                <span>PAINEL</span>

                <h1>Visão geral</h1>

                <p>
                    Acompanhe os acessos ao site do ELITE FC.
                </p>

            </div>


            <!-- ESTATÍSTICAS -->

            <section class="estatisticas">

                <div class="stat-card">

                    <div class="stat-icon">

                        <i class="fa-solid fa-users"></i>

                    </div>

                    <div>

                        <span>Total de visitas</span>

                        <strong id="total-visitas">
                            0
                        </strong>

                    </div>

                </div>


                <div class="stat-card">

                    <div class="stat-icon">

                        <i class="fa-solid fa-calendar-day"></i>

                    </div>

                    <div>

                        <span>Visitas hoje</span>

                        <strong id="visitas-hoje">
                            0
                        </strong>

                    </div>

                </div>


                <div class="stat-card">

                    <div class="stat-icon">

                        <i class="fa-solid fa-desktop"></i>

                    </div>

                    <div>

                        <span>Desktop</span>

                        <strong id="desktop">
                            0
                        </strong>

                    </div>

                </div>


                <div class="stat-card">

                    <div class="stat-icon">

                        <i class="fa-solid fa-mobile-screen"></i>

                    </div>

                    <div>

                        <span>Celular</span>

                        <strong id="celular">
                            0
                        </strong>

                    </div>

                </div>

            </section>


            <!-- ÚLTIMAS VISITAS -->

            <section class="tabela-container">

                <div class="tabela-topo">

                    <div>

                        <span>ACESSOS</span>

                        <h2>Últimas visitas</h2>

                    </div>

                    <button id="atualizar">

                        <i class="fa-solid fa-rotate"></i>

                        Atualizar

                    </button>

                </div>


                <div class="tabela-scroll">

                    <table>

                        <thead>

                            <tr>

                                <th>Data</th>

                                <th>Dispositivo</th>

                                <th>Navegador</th>

                                <th>Sistema</th>

                                <th>Página</th>

                            </tr>

                        </thead>

                        <tbody id="lista-visitas">

                        </tbody>

                    </table>

                </div>

            </section>


        </main>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="admin.js"></script>

</body>

</html>
